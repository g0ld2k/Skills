name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          python3 --version
          gh --version

      - name: Validate shared conventions are current
        run: |
          python3 scripts/sync-shared-conventions.py
          git diff --exit-code
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Validate repository structure
        run: python3 scripts/validate-skills-repo.py

      - name: Run regression tests
        run: python3 -m unittest discover -s tests

      - name: Validate JSON manifests
        run: |
          find plugin.json .agents .github schemas -name '*.json' -print |
            while IFS= read -r file; do
              echo "$file"
              python3 -m json.tool "$file" >/dev/null
            done

      - name: Check shell scripts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          find skills scripts -type f -name '*.sh' -print |
            while IFS= read -r file; do
              echo "$file"
              bash -n "$file"
              shellcheck -S warning "$file"
            done

      - name: Validate Agent Skills publisher shape
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
